<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13315c">
<title>Sign in · Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313315c'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  /* Navy palette — matches the coverage site + briefs. */
  :root{
    --lacquer:#f3f6fa; --raised:#fff; --gold:#13315c; --gold-rich:#1a3f6e;
    --crimson:#b3122b; --ink:#15181f; --body:#2a2f37; --faint:#727a89; --rule:#dce0e7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Albert Sans","Avenir Next","Helvetica Neue",Arial,system-ui,sans-serif;
    background:radial-gradient(1000px 480px at 50% -8%,#fff,transparent 62%),var(--lacquer);
    color:var(--body);display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased;
  }
  .card{
    background:var(--raised);border:1px solid var(--rule);border-radius:16px;
    padding:40px 34px;width:360px;max-width:100%;text-align:center;
    box-shadow:0 10px 34px rgba(16,42,77,.09);
  }
  .wordmark{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:700;
    font-size:2.6rem;line-height:.9;letter-spacing:-.015em;color:var(--ink)}
  .wordmark .dot{color:var(--crimson)}
  .tagline{font-family:"SFMono-Regular",ui-monospace,monospace;font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--crimson);margin:12px 0 4px}
  .lede{font-size:13px;color:var(--faint);margin:14px 0 26px;line-height:1.6}
  .gbtn{
    width:100%;display:inline-flex;align-items:center;justify-content:center;gap:11px;
    padding:13px 16px;font-size:14.5px;font-weight:600;font-family:inherit;color:var(--ink);
    background:#fff;border:1px solid var(--rule);border-radius:11px;cursor:pointer;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .gbtn:hover{border-color:var(--gold-rich);box-shadow:0 2px 10px rgba(19,49,92,.1)}
  .gbtn svg{width:18px;height:18px;flex-shrink:0}
  .foot{font-size:11.5px;color:var(--faint);margin-top:22px;line-height:1.6}
  .note{display:none;font-size:12px;color:var(--crimson);margin-top:16px;min-height:1.1em}
  .checking .gbtn,.checking .foot{opacity:.45;pointer-events:none}
  html.auth-unconfigured .gbtn{opacity:.5;pointer-events:none}
  html.auth-unconfigured #unconfigured{display:block}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="wordmark">ALFRED<span class="dot">.</span></div>
    <div class="tagline">Analyst Toolkit</div>
    <p class="lede">Sign in to access your analyst toolkit.</p>

    <button type="button" class="gbtn" id="google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="note" id="unconfigured">Sign-in isn't configured yet. Set the Supabase env vars to enable it.</div>
    <div class="note" id="error"></div>

    <p class="foot">Public information only · research support, not investment advice.</p>
  </main>

  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/auth.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/';
      const errEl = document.getElementById('error');

      // Surface an OAuth error returned in the URL (e.g. user cancelled).
      const oauthErr = params.get('error_description') || params.get('error');
      if (oauthErr) { errEl.textContent = decodeURIComponent(oauthErr); errEl.style.display = 'block'; }

      // If a session already exists (already signed in, or we just returned from Google and
      // supabase-js exchanged the ?code=), set the cookie and forward to the target.
      function forward(session) {
        if (!session) return;
        if (window.alfredMirror) window.alfredMirror(session); // ensure cookie is set first
        location.replace(next);
      }
      if (window.alfredAuth) {
        document.getElementById('card').classList.add('checking');
        window.alfredAuth.auth.onAuthStateChange((_e, s) => forward(s));
        window.alfredAuth.auth.getSession().then(({ data }) => {
          if (data.session) forward(data.session);
          else document.getElementById('card').classList.remove('checking');
        });
      }

      document.getElementById('google').addEventListener('click', function () {
        if (window.alfredSignIn) window.alfredSignIn(next);
      });
    })();
  </script>
</body>
</html>
